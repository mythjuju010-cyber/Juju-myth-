<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XEROF 256 PRO | Account</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
      body {
        background: linear-gradient(180deg, #0a0a12 0%, #10111c 100%);
        color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 20px;
      }
      .shell {
        width: 100%; max-width: 430px; background: #15151f; border: 1px solid #2b2b39;
        border-radius: 22px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        padding: 24px;
      }
      .brand {
        display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 1.2rem;
        font-weight: 900; letter-spacing: 0.04em; margin-bottom: 18px;
      }
      .ava {
        width: 42px; height: 42px; border-radius: 50%;
        background: linear-gradient(135deg, #c9a227, #22c55e); color: #111; display: flex;
        align-items: center; justify-content: center; font-weight: 900; border: 2px solid #22c55e;
      }
      .eyebrow {
        color: #c9a227; text-transform: uppercase; letter-spacing: 0.12em; font-size: 11px;
        text-align: center; font-weight: 800; margin-bottom: 12px;
      }
      h1 {
        font-size: clamp(2rem, 7vw, 2.6rem); text-align: center; margin-bottom: 8px;
      }
      .sub {
        text-align: center; color: #94a3b8; font-size: 14px; line-height: 1.5;
        margin-bottom: 20px;
      }
      label { display: block; font-size: 12px; font-weight: 700; margin-top: 14px; }
      input {
        width: 100%; padding: 14px 15px; margin-top: 8px; border-radius: 12px; border: 1px solid #333;
        background: #0a0a12; color: #fff; outline: none;
      }
      .row {
        display: flex; justify-content: space-between; align-items: center; margin-top: 14px; color: #94a3b8;
        font-size: 12px;
      }
      .row a { color: #c9a227; }
      .btn {
        display: flex; align-items: center; justify-content: center; width: 100%; padding: 15px;
        border: none; border-radius: 999px; margin-top: 18px; cursor: pointer; font-weight: 800;
      }
      .btn-primary { background: #c9a227; color: #111; }
      .btn-secondary { background: #1a1a28; color: #fff; border: 1px solid #333; }
      .divider {
        display: flex; align-items: center; gap: 12px; color: #94a3b8; margin: 18px 0 10px; font-size: 12px;
      }
      .divider::before, .divider::after {
        content: ""; height: 1px; flex: 1; background: #2b2b39;
      }
      .linkbar { text-align: center; margin-top: 18px; font-size: 13px; color: #94a3b8; }
      .linkbar a { color: #c9a227; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="brand">
        <div class="ava">✦</div>
        <div>XEROF <span style="color:#c9a227;">256</span> PRO</div>
      </div>

      <div class="eyebrow">Secure Portal</div>
      <h1>Welcome back</h1>
      <div class="sub">Access your trading vault, monitor strategy flow, and manage allocations securely.</div>

      <form>
        <label>Email</label>
        <input type="email" value="operator@xerof.pro" />

        <label>Password</label>
        <input type="password" value="••••••••••" />

        <div class="row">
          <span><input type="checkbox" checked /> Remember me</span>
          <a href="#">Forgot password?</a>
        </div>

        <button class="btn btn-primary" type="button">Log in</button>

        <div class="divider">or</div>
        <button class="btn btn-secondary" type="button">Create account</button>
      </form>

      <div class="linkbar"><a href="index.html">← Back to dashboard</a></div>
    </div>
  </body>
</html>
